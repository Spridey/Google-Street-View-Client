<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Google Street View Client</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    body {
      padding: 20px;
    }

    h1 {
      margin-top: 0;
    }

    #mainSection {
      margin-bottom: 20px;
    }

    #inputForm {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    #inputForm input {
      width: 180px;
      padding: 8px;
      font-size: 16px;
    }

    #inputForm button {
      padding: 8px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin: 10px 0;
      color: #aaa;
    }

    #streetview {
      display: block;
      width: 100%;
      height: 600px;
      border: 0;
      background: #000;
    }
  </style>
</head>

<body>

  <h1>Google Street View Client</h1>

  <canvas id="myCanvas" width="100" height="100"></canvas>

  <section id="mainSection">
    <form id="inputForm"></form>
    <div id="status"></div>
  </section>

  <iframe
    id="streetview"
    width="100%"
    height="600"
    style="border:0"
    allowfullscreen>
  </iframe>

  <script src="script.js"></script>

</body>
</html>
